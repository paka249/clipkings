<!-- Account ──────────────────────────────────────────────── -->
<div id="page-account" class="page">
  <div class="page-header">
    <h1><em>Account</em></h1>
    <p class="sub">Profile, appearance, and recent exports.</p>
  </div>
  <div class="account-cols">
    <div>
      <div class="card">
        <div class="card-title">Profile</div>
        <div class="profile-section">
          <div class="profile-avatar-lg" id="profile-avatar">A</div>
          <div style="flex:1">
            <div style="margin-bottom:10px">
              <label class="field-label">Display Name</label>
              <input id="profile-name" type="text" class="text-input" placeholder="Your name">
            </div>
            <div style="margin-bottom:10px">
              <label class="field-label">Email</label>
              <input id="profile-email" type="email" class="text-input" placeholder="your@email.com">
            </div>
            <div style="margin-bottom:14px">
              <label class="field-label">Plan</label>
              <div style="font-size:.82rem;color:var(--text-2);padding:3px 0">Free</div>
            </div>
            <button class="btn-primary" id="save-profile-btn" onclick="saveProfile()">Save Profile</button>
            <button class="btn-sm" onclick="logout()" style="margin-top:8px;color:var(--danger);border-color:var(--danger);width:100%">Sign out</button>
          </div>
        </div>
      </div>

      <div class="card" style="margin-top:14px">
        <div class="card-title">Appearance</div>
        <div class="profile-appearance">
          <label class="field-label" style="margin-bottom:6px;display:block">Theme</label>
          <div class="theme-row profile-theme-row">
            <button class="theme-btn active" id="prof-btn-dark" onclick="setBase('dark')">
              <svg class="icon icon-sm"><use href="#i-moon"/></svg> Dark
            </button>
            <button class="theme-btn" id="prof-btn-light" onclick="setBase('light')">
              <svg class="icon icon-sm"><use href="#i-sun"/></svg> Light
            </button>
          </div>
          <label class="field-label" style="margin-top:12px;margin-bottom:6px;display:block">Accent Color</label>
          <div class="profile-accent-row">
            <div class="profile-accent-swatches" id="profile-accent-swatches">
              <button class="accent-swatch" style="background:#3B82F6" data-color="#3B82F6" onclick="setAccent(this.dataset.color);syncAccentUI(this.dataset.color)" title="Blue"></button>
              <button class="accent-swatch" style="background:#8B5CF6" data-color="#8B5CF6" onclick="setAccent(this.dataset.color);syncAccentUI(this.dataset.color)" title="Purple"></button>
              <button class="accent-swatch" style="background:#EC4899" data-color="#EC4899" onclick="setAccent(this.dataset.color);syncAccentUI(this.dataset.color)" title="Pink"></button>
              <button class="accent-swatch" style="background:#22C55E" data-color="#22C55E" onclick="setAccent(this.dataset.color);syncAccentUI(this.dataset.color)" title="Green"></button>
              <button class="accent-swatch" style="background:#F59E0B" data-color="#F59E0B" onclick="setAccent(this.dataset.color);syncAccentUI(this.dataset.color)" title="Amber"></button>
              <button class="accent-swatch" style="background:#EF4444" data-color="#EF4444" onclick="setAccent(this.dataset.color);syncAccentUI(this.dataset.color)" title="Red"></button>
              <button class="accent-swatch" style="background:#06B6D4" data-color="#06B6D4" onclick="setAccent(this.dataset.color);syncAccentUI(this.dataset.color)" title="Cyan"></button>
            </div>
            <label class="accent-custom-wrap" title="Custom color">
              <input type="color" id="profile-accent-picker" value="#3B82F6" oninput="setAccent(this.value);syncAccentUI(this.value)">
              <span class="accent-custom-lbl">Custom</span>
            </label>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Recent Exports</div>
      <div id="account-exports"><p class="muted-text">Loading…</p></div>
    </div>
  </div>
</div>
